<!DOCTYPE html>
<html lang="da">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playlister – MusikBasen</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../theme.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<header>

    <div class="logo">
        <h1>MB</h1>
    </div>

    <nav>

        <a href="../index.html">Forside</a>

        <a href="artists.html">Kunstnere</a>

        <a href="albums.html">Albums</a>

        <a href="songs.html">Sange</a>

        <a href="playlists.html">Playlister</a>

    </nav>

    <div class="header-icons">

    <button
        id="search-button"
        aria-label="Søg"
    >
        🔍
    </button>

    <button
        id="favorites-button"
        aria-label="Favoritter"
    >
        ❤️
    </button>

    <button
        id="profile-button"
        aria-label="Profil"
    >
        👤
    </button>

</div>

</header>


<main>

    <section class="page-header">

        <h1>Playlister</h1>

        <p>
            Find playlister til enhver stemning.
        </p>

    </section>


    <section id="playlists">

        <div class="section-header">

    <h2>MusikBasen Playlister</h2>

    <button
        class="create-playlist-button"
        id="create-playlist-button"
    >
        ＋ Opret playlist
    </button>

</div>

        <div id="playlists-grid" class="playlists-grid"></div>
        
        <div
    id="create-playlist-form"
    class="create-playlist-overlay"
    style="display: none;"
>

    <div
    id="create-playlist-form"
    class="create-playlist-overlay"
    style="display: none;"
>

    <div class="create-playlist-modal">

        <div class="create-playlist-header">

            <div>

                <span class="create-playlist-label">
                    NY PLAYLIST
                </span>

                <h2>
                    Opret playlist
                </h2>

                <p>
                    Lav din egen samling af sange.
                </p>

            </div>

            <button
                id="cancel-playlist-button"
                class="create-playlist-close"
                aria-label="Luk"
            >
                ×
            </button>

        </div>


        <div class="create-playlist-fields">

            <label for="new-playlist-name">
                Navn
            </label>

            <input
                type="text"
                id="new-playlist-name"
                placeholder="Fx Sommer 2027"
                maxlength="40"
            >


            <label for="new-playlist-description">
                Beskrivelse
            </label>

            <textarea
                id="new-playlist-description"
                placeholder="Hvad er playlisten til?"
                maxlength="120"
            ></textarea>

        </div>


        <div class="create-playlist-actions">

            <button
                id="save-playlist-button"
                class="save-playlist-button"
            >
                Opret playlist
            </button>

        </div>

    </div>

</div>

    </section>
<section id="playlist-detail" style="display: none;">

    <section class="playlist-hero">

        <div
            class="playlist-detail-image"
            id="playlist-detail-image"
        >
            <span>▶</span>
        </div>


        <div class="playlist-detail-info">

            <span class="playlist-label">
                PLAYLIST
            </span>

            <h1 id="playlist-name">
                Playlist
            </h1>

            <p id="playlist-description"></p>

            <div class="playlist-meta">

                <span id="playlist-creator"></span>

                <span>•</span>

                <span id="playlist-song-count"></span>

            </div>
            <button
    class="play-playlist-button"
    id="play-playlist-button"
>
    ▶ Afspil playlist
</button>

        </div>

    </section>


    <section class="playlist-songs-section">

        <div class="section-header">

            <h2>Sange</h2>

        </div>

        <div
            id="playlist-songs"
        ></div>

    </section>

</section>
</main>


<script src="../data/playlists.js"></script>
<script src="../data/songs.js"></script>
<script src="../script.js"></script>

</body>

</html>
